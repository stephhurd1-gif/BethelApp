<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Upcoming at Bethel</title>
  <!-- Bethel homepage events carousel: mobile-fast-v3 -->
  <style>
    :root{
      --bg:#01060b;
      --panel:#0b1218;
      --panel2:#101922;
      --text:#fffefe;
      --muted:#aeb8bf;
      --gold:#f7bf5b;
      --border:rgba(255,255,255,.10);
    }
    *{box-sizing:border-box}
    html,body{margin:0;background:transparent;color:var(--text);font-family:Arial,Helvetica,sans-serif}
    body{padding:2px}
    .wrap{width:100%;margin:0 auto}
    .heading-row{
      display:flex;align-items:end;justify-content:space-between;gap:16px;
      margin:0 0 12px;
    }
    h2{margin:0;font-size:clamp(22px,3.2vw,34px);line-height:1.05}
    .sub{margin:4px 0 0;color:var(--muted);font-size:13px}
    .all-link{
      flex:0 0 auto;text-decoration:none;border:1px solid rgba(247,191,91,.36);
      color:var(--gold);border-radius:999px;padding:9px 13px;font-size:12px;font-weight:900;
      background:rgba(247,191,91,.08)
    }
    .carousel{position:relative}
    .viewport{
      overflow:hidden;border-radius:22px;border:1px solid var(--border);
      background:linear-gradient(145deg,var(--panel2),var(--panel));
      box-shadow:0 16px 38px rgba(0,0,0,.22)
    }
    .track{
      --visible:3;
      display:flex;
      align-items:stretch;
      transition:transform .55s cubic-bezier(.2,.8,.2,1)
    }
    .slide{
      flex:0 0 calc(100% / var(--visible));
      min-width:0;
      padding:0 7px;
    }
    .event{
      --cat-color:#aeb8bf;--cat-soft:rgba(174,184,191,.12);--cat-border:rgba(174,184,191,.34);
      height:100%;
      min-height:470px;
      display:flex;
      flex-direction:column;
      overflow:hidden;
      border-left:5px solid var(--cat-color);
      background:linear-gradient(145deg,#101922,#0b1218);
    }
    .cat-worship{--cat-color:#f7bf5b;--cat-soft:rgba(247,191,91,.14);--cat-border:rgba(247,191,91,.42)}
    .cat-community{--cat-color:#64c970;--cat-soft:rgba(100,201,112,.14);--cat-border:rgba(100,201,112,.42)}
    .cat-faith-study{--cat-color:#b56de0;--cat-soft:rgba(181,109,224,.14);--cat-border:rgba(181,109,224,.42)}
    .cat-ministry{--cat-color:#6ea8fe;--cat-soft:rgba(110,168,254,.14);--cat-border:rgba(110,168,254,.42)}
    .cat-special-event{--cat-color:#ff7a8a;--cat-soft:rgba(255,122,138,.14);--cat-border:rgba(255,122,138,.42)}
    .cat-youth{--cat-color:#4fd1c5;--cat-soft:rgba(79,209,197,.14);--cat-border:rgba(79,209,197,.42)}
    .cat-meetings{--cat-color:#d9a45f;--cat-soft:rgba(217,164,95,.14);--cat-border:rgba(217,164,95,.42)}
    .cat-other{--cat-color:#aeb8bf;--cat-soft:rgba(174,184,191,.12);--cat-border:rgba(174,184,191,.34)}
    .event-link{
      color:inherit;
      text-decoration:none;
      display:flex;
      flex-direction:column;
      height:100%;
      min-height:0;
    }
    .event.has-flyer{
      min-height:520px;
    }
    .event.no-flyer{
      min-height:390px;
    }
    .flyer-visual{
      flex:1;
      min-height:430px;
      display:grid;
      place-items:center;
      padding:10px;
      background:#060b10;
      border-bottom:1px solid var(--border);
      overflow:hidden;
    }
    .flyer-visual img{
      width:100%;
      height:100%;
      max-height:460px;
      object-fit:contain;
      display:block;
    }
    .flyer-visual.image-error{
      min-height:430px;
      padding:24px;
      text-align:center;
      color:var(--muted);
    }
    .flyer-visual.image-error::before{
      content:"Flyer unavailable";
      display:grid;
      place-items:center;
      width:100%;
      min-height:180px;
      border:1px dashed var(--cat-border);
      border-radius:14px;
      color:var(--cat-color);
      font-size:13px;
      font-weight:900;
    }
    .flyer-caption{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:13px 15px 14px;
      background:linear-gradient(145deg,#101922,#0b1218);
      border-top:1px solid rgba(255,255,255,.03);
    }
    .flyer-caption-text{
      min-width:0;
    }
    .flyer-caption h3{
      margin:0;
      font-size:15px;
      line-height:1.2;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .flyer-caption .mini-meta{
      margin-top:4px;
      color:var(--muted);
      font-size:11px;
      line-height:1.3;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .flyer-caption .view-cue{
      flex:0 0 auto;
      color:var(--cat-color);
      font-size:11px;
      font-weight:900;
      white-space:nowrap;
    }

    .no-flyer-body{
      flex:1;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:flex-start;
      padding:26px 24px 28px;
      background:
        radial-gradient(circle at 85% 10%, var(--cat-soft), transparent 35%),
        linear-gradient(145deg,#101922,#0b1218);
    }
    .no-flyer .badge{
      display:inline-flex;
      align-items:center;
      min-height:24px;
      padding:5px 9px;
      border-radius:999px;
      font-size:10px;
      font-weight:950;
      text-transform:uppercase;
      letter-spacing:.05em;
      background:var(--cat-soft);
      color:var(--cat-color);
      border:1px solid var(--cat-border);
      margin-bottom:18px;
    }
    .no-flyer .date-block{
      display:flex;
      align-items:center;
      gap:14px;
      margin-bottom:18px;
    }
    .no-flyer .date-card{
      width:104px;
      flex:0 0 104px;
      border:1px solid var(--cat-border);
      border-radius:16px;
      overflow:hidden;
      background:rgba(0,0,0,.18);
      text-align:center;
    }
    .date-card .month{
      padding:8px;
      background:var(--cat-color);
      color:#071015;
      font-size:11px;
      font-weight:950;
      letter-spacing:.08em;
      text-transform:uppercase;
    }
    .date-card .day{
      padding:12px 8px 4px;
      font-size:44px;
      line-height:1;
      font-weight:950;
    }
    .date-card .dow{
      padding:0 8px 11px;
      color:var(--muted);
      font-size:10px;
      font-weight:900;
      text-transform:uppercase;
    }
    .no-flyer h3{
      margin:0;
      font-size:clamp(22px,2.2vw,31px);
      line-height:1.08;
      letter-spacing:-.02em;
    }
    .no-flyer .meta{
      display:flex;
      flex-direction:column;
      gap:7px;
      margin-top:15px;
      color:#e7edf1;
      font-size:13px;
      font-weight:700;
    }
    .no-flyer .view-cue{
      margin-top:22px;
      color:var(--cat-color);
      font-size:12px;
      font-weight:900;
    }
    .event-link:focus-visible{
      outline:2px solid var(--cat-color);
      outline-offset:-3px;
      border-radius:18px;
    }
    @media (hover:hover) and (pointer:fine){
      .event-link:hover .flyer-visual img{transform:scale(1.012)}
      .flyer-visual img{transition:transform .25s ease}
      .event-link:hover .view-cue{text-decoration:underline}
    }
    .controls{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:12px}
    .arrow,.pause,.dot{
      border:1px solid var(--border);background:rgba(255,255,255,.035);color:#dfe6ea;
      cursor:pointer
    }
    .arrow,.pause{height:34px;border-radius:9px;padding:0 12px;font-weight:900}
    .dots{display:flex;gap:6px}
    .dot{width:9px;height:9px;border-radius:50%;padding:0}
    .dot.active{background:var(--gold);border-color:var(--gold)}
    .state{
      min-height:250px;display:grid;place-items:center;text-align:center;border:1px solid var(--border);
      border-radius:22px;background:linear-gradient(145deg,var(--panel2),var(--panel));color:var(--muted);padding:28px
    }
    @media(max-width:1050px){
      .track{--visible:2}
      .event.has-flyer{min-height:535px}
      .flyer-visual{min-height:445px}
      .flyer-visual img{max-height:475px}
    }
    @media(max-width:650px){
      .track{--visible:1}
      .heading-row{align-items:center}
      .sub{display:none}
      .slide{padding:0}
      .event.has-flyer{min-height:0}
      .flyer-visual{min-height:430px}
      .flyer-visual img{max-height:455px}
      .event.no-flyer{min-height:350px}
      .no-flyer-body{padding:24px 22px 26px}
      .no-flyer h3{font-size:28px}
    }
    @media(max-width:480px){
      .all-link{font-size:11px;padding:8px 10px}
      .flyer-visual{min-height:365px;padding:8px}
      .flyer-visual img{max-height:390px}
      .flyer-caption{padding:11px 12px 12px}
      .flyer-caption h3{font-size:14px}
      .flyer-caption .mini-meta{font-size:10px}
      .flyer-caption .view-cue{font-size:10px}
      .no-flyer-body{padding:22px 18px 24px}
    }
    @media(prefers-reduced-motion:reduce){.track{transition:none}}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="heading-row">
      <div>
        <h2>Upcoming at Bethel</h2>
        <p class="sub">What’s happening next in worship, community, ministry, and more.</p>
      </div>
      <a class="all-link" href="https://events.bethelamelancaster.com" target="_top">View All Events</a>
    </div>

    <div id="loading" class="state">Loading upcoming events…</div>

    <section id="carousel" class="carousel" aria-label="Upcoming Bethel events" style="display:none">
      <div class="viewport">
        <div class="track" id="track"></div>
      </div>
      <div class="controls" id="controls">
        <button class="arrow" id="prev" type="button" aria-label="Previous event">‹</button>
        <div class="dots" id="dots" aria-label="Choose event"></div>
        <button class="arrow" id="next" type="button" aria-label="Next event">›</button>
        <button class="pause" id="pause" type="button" aria-label="Pause automatic rotation">Ⅱ</button>
      </div>
    </section>
  </main>

  <script type="module">
    import ICAL from 'https://cdn.jsdelivr.net/npm/ical.js@2.2.1/dist/ical.min.js';

    const EVENTS_FEED_URL =
      'https://us-central1-bethelapp-f2d4e.cloudfunctions.net/getPublicCalendarIcs';
    const EVENT_IMAGE_FEED_URL =
      'https://us-central1-bethelapp-f2d4e.cloudfunctions.net/getEventFlyers';

    const categoryIcons = {
      'Worship':'✦','Faith & Study':'✧','Youth':'★','Community':'♥',
      'Meetings':'◆','Ministry':'●','Special Event':'✦'
    };

    function categoryClass(category){
      return ({
        'Worship':'cat-worship','Community':'cat-community',
        'Faith & Study':'cat-faith-study','Ministry':'cat-ministry',
        'Special Event':'cat-special-event','Youth':'cat-youth',
        'Meetings':'cat-meetings'
      })[category] || 'cat-other';
    }

    function esc(s){
      return String(s == null ? '' : s)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }

    function startOfDay(d){const x=new Date(d);x.setHours(0,0,0,0);return x}
    function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
    function sameDay(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate()}
    function formatTime(d){return new Intl.DateTimeFormat('en-US',{hour:'numeric',minute:'2-digit'}).format(d)}
    function formatDate(d){return new Intl.DateTimeFormat('en-US',{weekday:'short',month:'short',day:'numeric'}).format(d)}

    function relativeBadge(ev){
      const diff=Math.round((startOfDay(ev.start)-startOfDay(new Date()))/86400000);
      if(diff===0)return'Today'; if(diff===1)return'Tomorrow'; return'';
    }

    function inferCategory(title,description){
      const s=(title+' '+description).toLowerCase();
      if(/\b(ypd|youth|young people|children|kids|teen)\b/.test(s))return'Youth';
      if(/\b(outreach|community|food|camp|school supply|back.to.school|neighborhood|service project)\b/.test(s))return'Community';
      if(/\b(bible study|prayer|sunday school|study|class meeting)\b/.test(s))return'Faith & Study';
      if(/\b(worship|service|sunday service|communion|revival)\b/.test(s))return'Worship';
      if(/\b(meeting|board|committee|conference|lay organization|trustee|steward)\b/.test(s))return'Meetings';
      if(/\b(women|men|missionary|choir|ministry|usher|music)\b/.test(s))return'Ministry';
      return'Special Event';
    }

    function parseDescriptionMeta(raw,title){
      const meta={featured:false,category:'',image:'',clean:''};
      const clean=[];
      String(raw||'').split(/\r?\n/).forEach(line=>{
        const t=line.trim();
        if(/^\[featured\]$/i.test(t)){meta.featured=true;return}

        let m=t.match(/^\[category:\s*(.+?)\]$/i);
        if(m){meta.category=m[1].trim();return}

        m=t.match(/^\[image:\s*(https:\/\/.+?)\]$/i);
        if(m){meta.image=m[1].trim();return}

        // Link metadata belongs on the full Events page, not the homepage card.
        if(/^\[link:/i.test(t))return;

        clean.push(line);
      });
      meta.clean=clean.join('\n').trim();
      if(!meta.category)meta.category=inferCategory(title,meta.clean);
      return meta;
    }

    function eventId(uid,start){
      const base=uid+'|'+start.toISOString();let hash=0;
      for(let i=0;i<base.length;i++){hash=((hash<<5)-hash)+base.charCodeAt(i);hash|=0}
      return'e'+Math.abs(hash).toString(36);
    }

    function eventToDisplay(obj,startDate,endDate,recurring){
      const rawTitle=obj.summary||'Bethel Event';
      const titleFeatured=/^\s*⭐/.test(rawTitle);
      const title=rawTitle.replace(/^\s*⭐\s*/,'').trim()||'Bethel Event';
      const meta=parseDescriptionMeta(obj.description||'',title);
      const allDay=Boolean(obj.startDate&&obj.startDate.isDate);
      const start=startDate;
      let end=endDate;
      if(!end||Number.isNaN(end.getTime()))end=new Date(start.getTime()+(allDay?86400000:3600000));
      return{
        id:eventId(obj.uid||title,start),uid:obj.uid||title,title,
        description:meta.clean,location:obj.location||'',start,end,allDay,
        recurring:Boolean(recurring),category:meta.category,
        featured:Boolean(titleFeatured||meta.featured),image:meta.image||''
      };
    }

    function parseCalendar(icsText){
      const root=new ICAL.Component(ICAL.parse(icsText));
      try{root.getAllSubcomponents('vtimezone').forEach(c=>{try{ICAL.TimezoneService.register(new ICAL.Timezone(c))}catch(_){}})}catch(_){}
      const objs=root.getAllSubcomponents('vevent').map(c=>new ICAL.Event(c));
      const bases=new Map(),exceptions=[];
      objs.forEach(ev=>{
        const rid=ev.component.getFirstPropertyValue('recurrence-id');
        if(rid)exceptions.push(ev);else bases.set(ev.uid,ev);
      });
      exceptions.forEach(ex=>{const base=bases.get(ex.uid);if(base){try{base.relateException(ex)}catch(_){}}});
      const rangeStart=addDays(startOfDay(new Date()),-1);
      const rangeEnd=addDays(rangeStart,180);
      const results=[];
      bases.forEach(ev=>{
        if(!ev.isRecurring()){
          const s=ev.startDate.toJSDate(),e=ev.endDate?ev.endDate.toJSDate():null;
          if(e>=rangeStart&&s<=rangeEnd)results.push(eventToDisplay(ev,s,e,false));
          return;
        }
        const it=ev.iterator();let next=null,safety=0;
        while(safety++<4000&&(next=it.next())){
          const rough=next.toJSDate();if(rough>rangeEnd)break;if(rough<rangeStart)continue;
          try{
            const d=ev.getOccurrenceDetails(next),source=d.item||ev;
            const s=d.startDate.toJSDate(),e=d.endDate?d.endDate.toJSDate():null;
            if(e>=rangeStart&&s<=rangeEnd)results.push(eventToDisplay(source,s,e,true));
          }catch(_){
            const dur=Math.max(0,ev.endDate.toJSDate().getTime()-ev.startDate.toJSDate().getTime());
            results.push(eventToDisplay(ev,rough,new Date(rough.getTime()+dur),true));
          }
        }
      });
      const dedup=new Map();results.forEach(ev=>dedup.set(ev.id,ev));
      return Array.from(dedup.values()).filter(ev=>ev.end>=new Date()).sort((a,b)=>a.start-b.start);
    }

    function normalizeUid(value){
      return String(value||'').trim().toLowerCase();
    }

    function normalizeTitle(value){
      return String(value||'')
        .replace(/^\s*⭐\s*/,'')
        .toLowerCase()
        .replace(/&/g,'and')
        .replace(/[^a-z0-9]+/g,' ')
        .trim()
        .replace(/\s+/g,' ');
    }

    function localDateKey(d){
      return d.getFullYear()+'-'+
        String(d.getMonth()+1).padStart(2,'0')+'-'+
        String(d.getDate()).padStart(2,'0');
    }

    function feedDateKey(value){
      const m=String(value||'').match(/^(\d{4}-\d{2}-\d{2})/);
      return m?m[1]:'';
    }

    async function loadFlyerRows(){
      try{
        const r=await fetch(EVENT_IMAGE_FEED_URL,{cache:'default'});
        if(!r.ok)return[];
        const p=await r.json();
        return p&&Array.isArray(p.events)?p.events:[];
      }catch(err){
        console.warn('Could not load flyer metadata:',err);
        return[];
      }
    }

    function applyFlyers(events,rows){
      const byUid=new Map();
      const byTitleDate=new Map();
      const byTitle=new Map();

      rows.forEach(row=>{
        if(!row||!row.imageUrl)return;

        const image=String(row.imageUrl);
        const uid=normalizeUid(row.iCalUID);
        if(uid&&!byUid.has(uid))byUid.set(uid,image);

        const title=normalizeTitle(row.title);
        const date=feedDateKey(row.start);
        if(title&&date&&!byTitleDate.has(title+'|'+date)){
          byTitleDate.set(title+'|'+date,image);
        }
        if(title&&!byTitle.has(title)){
          byTitle.set(title,image);
        }
      });

      events.forEach(ev=>{
        // Preserve a legacy [image: ...] value if one is already present.
        if(ev.image)return;

        const uidMatch=byUid.get(normalizeUid(ev.uid));
        if(uidMatch){
          ev.image=uidMatch;
          return;
        }

        const title=normalizeTitle(ev.title);
        const exact=byTitleDate.get(title+'|'+localDateKey(ev.start));
        if(exact){
          ev.image=exact;
          return;
        }

        // Use title-only fallback only when that title maps to exactly one
        // image row in the current flyer feed.
        if(title&&byTitle.has(title)){
          const sameTitle=rows.filter(r=>normalizeTitle(r&&r.title)===title);
          if(sameTitle.length===1)ev.image=byTitle.get(title);
        }
      });
    }

    function selectCarouselEvents(events){
      // Keep only one upcoming occurrence from each recurring series.
      const unique=[],seenRecurring=new Set();

      for(const ev of events){
        if(ev.recurring){
          const key=String(ev.uid||ev.title).toLowerCase();
          if(seenRecurring.has(key))continue;
          seenRecurring.add(key);
        }
        unique.push(ev);
      }

      // Force true chronological order AFTER flyer matching/deduping.
      // Flyer presence can never affect position in the homepage carousel.
      unique.sort((a,b)=>{
        const byStart=a.start.getTime()-b.start.getTime();
        if(byStart!==0)return byStart;
        return String(a.title||'').localeCompare(String(b.title||''));
      });

      return unique.slice(0,7);
    }

    function homepageImageUrl(url){
      // The homepage does not need a 1600px-wide Drive thumbnail.
      // A smaller image is much faster on phones while remaining sharp in the carousel.
      return String(url||'').replace(/([?&])sz=w\d+/i,'$1sz=w1000');
    }

    function slideMarkup(ev,slideIndex=0){
      const month=new Intl.DateTimeFormat('en-US',{month:'short'}).format(ev.start);
      const dow=new Intl.DateTimeFormat('en-US',{weekday:'short'}).format(ev.start);
      const time=ev.allDay?'All day':formatTime(ev.start);
      const href='https://events.bethelamelancaster.com?event='+encodeURIComponent(ev.id);
      const dateText=formatDate(ev.start)+(ev.allDay?'':' · '+time);
      const locationText=ev.location||'Bethel AME Lancaster';

      if(ev.image){
        return`
          <div class="slide">
            <article class="event has-flyer ${categoryClass(ev.category)}">
              <a class="event-link" href="${href}" target="_top" aria-label="View ${esc(ev.title)} event details">
                <div class="flyer-visual">
                  <img
                    src="${esc(homepageImageUrl(ev.image))}"
                    alt="${esc(ev.title+' event flyer')}"
                    loading="${slideIndex < visibleCount() ? 'eager' : 'lazy'}"
                    fetchpriority="${slideIndex === 0 ? 'high' : 'auto'}"
                    decoding="async"
                    referrerpolicy="no-referrer"
                  >
                </div>
                <div class="flyer-caption">
                  <div class="flyer-caption-text">
                    <h3>${esc(ev.title)}</h3>
                    <div class="mini-meta">${esc(dateText)}</div>
                  </div>
                  <span class="view-cue">View Event →</span>
                </div>
              </a>
            </article>
          </div>`;
      }

      return`
        <div class="slide">
          <article class="event no-flyer ${categoryClass(ev.category)}">
            <a class="event-link" href="${href}" target="_top" aria-label="View ${esc(ev.title)} event details">
              <div class="no-flyer-body">
                <span class="badge">${esc((categoryIcons[ev.category]||'•')+' '+ev.category)}</span>
                <div class="date-block">
                  <div class="date-card">
                    <div class="month">${esc(month)}</div>
                    <div class="day">${ev.start.getDate()}</div>
                    <div class="dow">${esc(dow)}</div>
                  </div>
                </div>
                <h3>${esc(ev.title)}</h3>
                <div class="meta">
                  <span>◷ ${esc(dateText)}</span>
                  <span>⌖ ${esc(locationText)}</span>
                </div>
                <span class="view-cue">View Event →</span>
              </div>
            </a>
          </article>
        </div>`;
    }

    let slides=[],index=0,timer=null,paused=false;
    const track=document.getElementById('track');
    const dots=document.getElementById('dots');
    const pauseBtn=document.getElementById('pause');
    const prefersReduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches;

    function visibleCount(){
      if(window.innerWidth<=650)return 1;
      if(window.innerWidth<=1050)return 2;
      return 3;
    }

    function maxIndex(){
      return Math.max(0,slides.length-visibleCount());
    }

    function renderDots(){
      const count=maxIndex()+1;
      dots.innerHTML=Array.from({length:count},(_,i)=>
        `<button class="dot ${i===index?'active':''}" type="button" data-index="${i}" aria-label="Show events starting at item ${i+1}"></button>`
      ).join('');
      dots.querySelectorAll('[data-index]').forEach(btn=>
        btn.addEventListener('click',()=>{
          show(Number(btn.dataset.index));
          restart();
        })
      );
    }

    function show(i){
      if(!slides.length)return;
      const max=maxIndex();
      if(i>max)i=0;
      if(i<0)i=max;
      index=i;
      track.style.transform=`translateX(-${index*(100/visibleCount())}%)`;
      dots.querySelectorAll('.dot').forEach((d,n)=>d.classList.toggle('active',n===index));
    }

    function restart(){
      clearInterval(timer);
      if(paused||prefersReduced||maxIndex()===0)return;
      timer=setInterval(()=>show(index+1),7000);
    }
    function setPaused(value){
      paused=value;pauseBtn.textContent=paused?'▶':'Ⅱ';
      pauseBtn.setAttribute('aria-label',paused?'Resume automatic rotation':'Pause automatic rotation');
      restart();
    }

    const HOME_EVENTS_CACHE_KEY='bethel_home_events_v3';
    const HOME_EVENTS_CACHE_MS=15*60*1000;

    function serializeSlides(items){
      return items.map(ev=>({
        ...ev,
        start:ev.start.toISOString(),
        end:ev.end.toISOString()
      }));
    }

    function deserializeSlides(items){
      return (Array.isArray(items)?items:[]).map(ev=>({
        ...ev,
        start:new Date(ev.start),
        end:new Date(ev.end)
      })).filter(ev=>!Number.isNaN(ev.start.getTime())&&!Number.isNaN(ev.end.getTime()));
    }

    function readSlideCache(){
      try{
        const raw=localStorage.getItem(HOME_EVENTS_CACHE_KEY);
        if(!raw)return[];
        const saved=JSON.parse(raw);
        if(!saved||!saved.savedAt||Date.now()-saved.savedAt>HOME_EVENTS_CACHE_MS)return[];
        return deserializeSlides(saved.slides).filter(ev=>ev.end>=new Date());
      }catch(_){return[]}
    }

    function writeSlideCache(items){
      try{
        localStorage.setItem(HOME_EVENTS_CACHE_KEY,JSON.stringify({
          savedAt:Date.now(),
          slides:serializeSlides(items)
        }));
      }catch(_){}
    }

    function renderSlides(items){
      slides=items;
      if(!slides.length)return false;

      index=0;
      track.innerHTML=slides.map((ev,i)=>slideMarkup(ev,i)).join('');

      track.querySelectorAll('.flyer-visual img').forEach(img=>{
        img.addEventListener('error',()=>{
          const visual=img.closest('.flyer-visual');
          if(visual){
            img.remove();
            visual.classList.add('image-error');
          }
        },{once:true});
      });

      renderDots();
      show(0);
      document.getElementById('loading').style.display='none';
      document.getElementById('carousel').style.display='block';
      document.getElementById('controls').style.display=maxIndex()>0?'flex':'none';
      restart();
      reportHeight();
      return true;
    }

    async function fetchFreshSlides(){
      // Start both network requests together. Previously the flyer request did not
      // begin until after the entire calendar download and parse had completed.
      const flyerPromise=loadFlyerRows();

      const r=await fetch(EVENTS_FEED_URL,{cache:'default'});
      if(!r.ok)throw new Error('calendar');
      const ics=await r.text();
      if(!ics.includes('BEGIN:VCALENDAR'))throw new Error('calendar');

      let events=parseCalendar(ics);
      const flyerRows=await flyerPromise;
      applyFlyers(events,flyerRows);

      return selectCarouselEvents(events)
        .sort((a,b)=>a.start.getTime()-b.start.getTime());
    }

    async function init(){
      const cached=readSlideCache();
      const showedCache=renderSlides(cached);

      try{
        const fresh=await fetchFreshSlides();
        if(!fresh.length)throw new Error('empty');

        writeSlideCache(fresh);
        renderSlides(fresh);
      }catch(err){
        if(!showedCache){
          document.getElementById('loading').innerHTML=
            'Upcoming events are temporarily unavailable. <a href="https://events.bethelamelancaster.com" target="_top" style="color:#f7bf5b">View the Events page</a>.';
          reportHeight();
        }
        console.warn('Homepage events load error:',err);
      }
    }

    document.getElementById('prev').addEventListener('click',()=>{show(index-1);restart()});
    document.getElementById('next').addEventListener('click',()=>{show(index+1);restart()});
    pauseBtn.addEventListener('click',()=>setPaused(!paused));
    document.getElementById('carousel').addEventListener('mouseenter',()=>{clearInterval(timer)});
    document.getElementById('carousel').addEventListener('mouseleave',restart);
    document.addEventListener('visibilitychange',()=>document.hidden?clearInterval(timer):restart());

    let resizeTimer;
    window.addEventListener('resize',()=>{
      clearTimeout(resizeTimer);
      resizeTimer=setTimeout(()=>{
        index=Math.min(index,maxIndex());
        renderDots();
        show(index);
        document.getElementById('controls').style.display=maxIndex()>0?'flex':'none';
        restart();
        reportHeight();
      },120);
    });

    function reportHeight(){
      try{window.parent.postMessage({type:'bethel-home-events-height',height:document.documentElement.scrollHeight},'*')}catch(_){}
    }
    new ResizeObserver(reportHeight).observe(document.body);

    init();
  </script>
</body>
</html>
